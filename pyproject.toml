[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steam-desktop-importer"
version = "1.0.0"
description = "Import FreeDesktop .desktop applications into Steam as non-Steam shortcuts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andres Ortiz", email = "andresdortiz@gmail.com" }]
keywords = ["steam", "desktop", "linux", "freedesktop", "steamgriddb"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Games/Entertainment",
]

# Runtime dependencies per IMPLEMENTATION.md section 4.
# Phases 0-1 only need pyxdg; the rest are declared up front so the tested
# dependency range and lock file cover the whole MVP.
dependencies = [
    "PySide6>=6.6",
    "vdf>=3.4",
    "requests>=2.31",
    "psutil>=5.9",
    "pyxdg>=0.28",
]

[project.urls]
Homepage = "https://github.com/zany130/steam-desktop-importer"
Issues = "https://github.com/zany130/steam-desktop-importer/issues"
Changelog = "https://github.com/zany130/steam-desktop-importer/blob/main/CHANGELOG.md"

[project.scripts]
steam-desktop-importer = "steam_desktop_importer.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
packaging = [
    "pyinstaller>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/steam_desktop_importer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "live_steam: touches a real Steam installation; read-only unless explicitly stated",
]

[tool.ruff]
line-length = 100
target-version = "py310"
